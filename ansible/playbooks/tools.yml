---
- name: Install pipeline tools on Ubuntu laptop
  hosts: jenkins
  become: true

  vars:
    maven_version: "3.9.9"

  tasks:
    # ── Maven 3.9 ─────────────────────────────────────────
    - name: Download Maven {{ maven_version }}
      get_url:
        url: "https://archive.apache.org/dist/maven/maven-3/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
        dest: /tmp/maven.tar.gz
        mode: '0644'

    - name: Extract Maven to /opt
      unarchive:
        src: /tmp/maven.tar.gz
        dest: /opt
        remote_src: yes

    - name: Create Maven symlink
      file:
        src: "/opt/apache-maven-{{ maven_version }}"
        dest: /opt/maven
        state: link
        force: yes

    - name: Set Maven in PATH for all users
      copy:
        dest: /etc/profile.d/maven.sh
        content: |
          export MAVEN_HOME=/opt/maven
          export PATH=$MAVEN_HOME/bin:$PATH
        mode: '0755'

    - name: Verify Maven version
      shell: /opt/maven/bin/mvn -version
      register: mvn_ver
      changed_when: false

    - name: Print Maven version
      debug:
        msg: "{{ mvn_ver.stdout }}"

    # ── Trivy ─────────────────────────────────────────────
    - name: Get latest Trivy version from GitHub API
      uri:
        url: https://api.github.com/repos/aquasecurity/trivy/releases/latest
        return_content: yes
      register: trivy_release

    - name: Set Trivy version fact
      set_fact:
        trivy_version: "{{ trivy_release.json.tag_name | replace('v', '') }}"

    - name: Download Trivy binary
      get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.tar.gz"
        dest: /tmp/trivy.tar.gz
        mode: '0644'

    - name: Extract Trivy to /usr/local/bin
      unarchive:
        src: /tmp/trivy.tar.gz
        dest: /usr/local/bin
        remote_src: yes
        include:
          - trivy

    - name: Set Trivy permissions
      file:
        path: /usr/local/bin/trivy
        mode: '0755'

    - name: Verify Trivy
      command: trivy --version
      register: trivy_ver
      changed_when: false

    - name: Print Trivy version
      debug:
        msg: "{{ trivy_ver.stdout }}"

    # ── AWS CLI v2 ────────────────────────────────────────
    - name: Remove old AWS CLI v1 if installed via apt
      apt:
        name: awscli
        state: absent
      ignore_errors: yes

    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unzip AWS CLI v2
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes

    - name: Install AWS CLI v2
      command: /tmp/aws/install --update

    - name: Verify AWS CLI version
      command: aws --version
      register: aws_ver
      changed_when: false

    - name: Print AWS CLI version
      debug:
        msg: "{{ aws_ver.stdout }}"